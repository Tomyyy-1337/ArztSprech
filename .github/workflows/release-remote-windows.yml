name: Release Remote Client (Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build client (remote mode)
        run: cargo build --release -p arztsprech-client --features remote

      - name: Package binary
        shell: pwsh
        run: |
          $asset = "arztsprech-remote-${{ github.ref_name }}-windows-x86_64.exe"
          Copy-Item target\release\arztsprech.exe $asset
          echo "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ASSET" `
            --title "${{ github.ref_name }} (remote client)" `
            --generate-notes
