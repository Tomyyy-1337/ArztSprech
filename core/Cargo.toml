[package]
name = "arztsprech-core"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
whisper-rs = { version = "0.16.0", optional = true }

[features]
# Lokale Transkription (Whisper). Für Server und Standalone-Client nötig.
transcriber = ["dep:whisper-rs"]
default = ["cuda"]
cuda = ["transcriber", "whisper-rs/cuda"]
vulkan = ["transcriber", "whisper-rs/vulkan"]
