[package]
name = "arztsprech-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arztsprech"
path = "src/main.rs"

[dependencies]
arztsprech-core = { path = "../core"}
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "smol"] }
enigo = "0.6.1"

[features]
standalone = ["arztsprech-core/transcriber"]
remote = []
cuda = ["arztsprech-core/cuda"]
vulkan = ["arztsprech-core/vulkan"]
