[package]
name = "arztsprech-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arztsprech"
path = "src/main.rs"

[dependencies]
arztsprech-core = { path = "../core"}
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "smol"] }
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["ico"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
standalone = ["arztsprech-core/transcriber"]
remote = []
cuda = ["arztsprech-core/cuda"]
vulkan = ["arztsprech-core/vulkan"]

[target."cfg(windows)".build-dependencies]
winres = "0.1.12"
